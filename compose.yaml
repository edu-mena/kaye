# Local and CI stack: the production image + MariaDB.
#   docker compose up --build --wait     then open http://localhost:8080
# Not used in production (Hostinger shared hosting runs no containers).
# See docs/infraestrutura.md.

name: kaye

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kaye:local
    ports:
      - '8080:8080'
    environment:
      APP_URL: http://localhost:8080
      ALLOW_EPHEMERAL_APP_KEY: 'true'
      RUN_MIGRATIONS: 'true'
      RUN_IMPORT: 'true'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: kaye
      DB_USERNAME: kaye
      DB_PASSWORD: kaye-local-only
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      ADMIN_EMAILS: admin@kaye.test
      # The end-to-end tests: many browsers at once from one IP (production keeps 300, config/kaye.php).
      API_READS_PER_MINUTE: '5000'
    depends_on:
      db:
        condition: service_healthy
    # Hardening: read-only filesystem; only these in-memory folders are writable
    # (uid/gid 33 = www-data, the user Apache and PHP run as).
    read_only: true
    tmpfs:
      - /tmp:uid=33,gid=33
      - /var/run/apache2:uid=33,gid=33
      - /var/lock/apache2:uid=33,gid=33
      - /var/www/html/storage/framework/cache:uid=33,gid=33
      - /var/www/html/storage/framework/sessions:uid=33,gid=33
      - /var/www/html/storage/framework/views:uid=33,gid=33
      - /var/www/html/storage/logs:uid=33,gid=33
      - /var/www/html/bootstrap/cache:uid=33,gid=33
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: kaye
      MARIADB_USER: kaye
      MARIADB_PASSWORD: kaye-local-only
      MARIADB_RANDOM_ROOT_PASSWORD: 'true'
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
