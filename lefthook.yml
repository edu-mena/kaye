# Git hooks: quick checks on the files being committed. CI runs the full set.
# Installed by `npm install` at the repository root (see README.md).

pre-commit:
  parallel: true
  jobs:
    - name: php-format
      root: apps/api/
      glob: '*.php'
      run: vendor/bin/pint {staged_files}
      stage_fixed: true

    - name: web-format
      root: apps/web/
      glob: '*.{ts,tsx,css,json,html}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: web-lint
      root: apps/web/
      glob: '*.{ts,tsx}'
      run: npx oxlint --deny-warnings {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: npx commitlint --edit {1}
