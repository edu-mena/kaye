# Builds the release once and publishes it to staging first, then to production:
#   publish (deploy-staging branch) -> staging (SSH + smoke test) -> promote (deploy branch) -> production (SSH + smoke test)
# The hPanel Git link of each site pulls its branch (webhook); scripts/finish-deploy.sh finishes the job over SSH.
# Production gets exactly the tree that passed on staging. Setup: docs/infraestrutura.md and docs/guia-hostinger.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two releases never publish at the same time, and a newer one does not cancel one in the middle of publishing.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to the deploy-staging branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tree: ${{ steps.push.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy-staging
          path: deploy-tree
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, mbstring, zip, gd, sodium
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the release (web app + Laravel with production dependencies)
        run: scripts/package-release.sh "$GITHUB_SHA"
      - name: Put it in the deploy-staging branch
        run: |
          tar -xzf "build/kaye-$GITHUB_SHA.tar.gz" -C build
          scripts/publish-deploy.sh "build/kaye-$GITHUB_SHA" deploy-tree "$GITHUB_SHA"
      - name: Push
        id: push
        working-directory: deploy-tree
        run: |
          git push origin HEAD:deploy-staging
          echo "tree=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  staging:
    name: Finish on staging (SSH + smoke test)
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for staging to pull the release, finish it and test it
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          SITE_DIR: ${{ secrets.HOSTINGER_SITE_DIR }}
          SITE_URL: ${{ vars.SITE_URL }}
          # The site's HEALTH_TOKEN, so the outside test reads the cron too (docs/observabilidade.md).
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: scripts/finish-deploy.sh "$GITHUB_SHA"

  promote:
    name: Publish the tested release to the deploy branch
    needs: [publish, staging]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.tree }}
          path: tested
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy
          path: deploy-tree
      - name: Copy the staging tree into the deploy branch
        run: scripts/publish-deploy.sh tested deploy-tree "$GITHUB_SHA"
      - name: Push
        working-directory: deploy-tree
        run: git push origin HEAD:deploy

  production:
    name: Finish on production (SSH + smoke test)
    needs: promote
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for production to pull the release, finish it and test it
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          SITE_DIR: ${{ secrets.HOSTINGER_SITE_DIR }}
          SITE_URL: ${{ vars.SITE_URL }}
          # The site's HEALTH_TOKEN, so the outside test reads the cron too (docs/observabilidade.md).
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: scripts/finish-deploy.sh "$GITHUB_SHA"
