# Data for the Mercado. Weekly (Saturday): the job sites, the Jobartis post pages and the Diário da República's dispatches.
# Every 2 hours: a light run of the job sites (only the first pages, only what is new), sent to the API. Both send the
# facts to POST /api/v1/ingest/jobs with the INGEST_TOKEN secret and the KAYE_API_URL variable (docs/arquitetura.md, 5.2).
# The collected facts (scrapers/data) live in an artifact kept 90 days and carried from run to run; only the
# counts reach the repository, through a pull request. Why here and not on the hosting: docs/arquitetura.md.
name: Market data

on:
  schedule:
    - cron: '0 21 * * 6' # Saturday 22:00 in Luanda: the full run
    - cron: '15 */3 * * *' # every 3 hours: the light run
  workflow_dispatch:

permissions:
  actions: read # last week's artifact
  contents: write # the branch with the new counts
  pull-requests: write

jobs:
  collect:
    name: Collect and count
    if: github.event.schedule != '15 */3 * * *'
    concurrency:
      group: market-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without last week's facts (the first run, or 90 days without one) everything is read again.
      - name: Last week's facts
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow market-data.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ] && gh run download "$run" --name market-data --dir data; then
            echo "since=$(date -u -d '14 days ago' +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Job sites
        env:
          SINCE: ${{ steps.previous.outputs.since }}
        run: python3 -m jobs.collect ${SINCE:+--since "$SINCE"}

      - name: Jobartis post pages (last 60 days)
        run: python3 -m jobs.details

      - name: Diário da República dispatches
        run: python3 -m jobs.official

      - name: Send the facts to the API
        env:
          KAYE_API_URL: ${{ vars.KAYE_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SINCE: ${{ steps.previous.outputs.since }}
        run: python3 -m jobs.push ${SINCE:+--since "$SINCE"}

      - name: Count
        run: python3 -m jobs.summarize

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: market-data
          path: scrapers/data/*.jsonl
          retention-days: 90

      # The API imports a copy of the app's data (apps/api/database/data); src/data/export.test.ts fails on `main`
      # while it is out of date, so the pull request carries both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Export the data for the API
        working-directory: apps/web
        run: |
          npm ci
          npm run export:data

      - name: Pull request with the new counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- ../apps/web/src/data/market ../apps/api/database/data; then
            echo "The counts did not change."
            exit 0
          fi
          branch=data/market-weekly
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add ../apps/web/src/data/market ../apps/api/database/data
          git commit -m "chore(data): weekly market counts ($(date -u +%F))"
          git push --force origin "$branch"
          # `gh pr view` also finds closed PRs and fails on other errors; only an open PR means "nothing to create".
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "The pull request for $branch is already open: the push updated it."
            exit 0
          fi
          gh pr create --head "$branch" \
            --title 'chore(data): weekly market counts' \
            --body 'Counts from the weekly collection (job sites, Jobartis post pages, Diário da República dispatches). Only aggregates: the facts stay in the run artifact.'

  # The light run: the posts of the last 3 days only, no artifact, nothing but the API. Every 3 hours since
  # 25/11/2026, when November passed 2000 Actions minutes (scrapers/README.md).
  light:
    name: Light run
    if: github.event.schedule == '15 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: market-light
      cancel-in-progress: false
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Job sites (last 3 days)
        run: |
          start=$(date -u +%s)
          python3 -m jobs.collect --since "$(date -u -d '3 days ago' +%F)"
          echo "collect_seconds=$(( $(date -u +%s) - start ))" >> "$GITHUB_STEP_SUMMARY"

      - name: Send the facts to the API
        env:
          KAYE_API_URL: ${{ vars.KAYE_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python3 -m jobs.push --since "$(date -u -d '3 days ago' +%F)"
