# Monthly updates for every dependency source, each ecosystem in ONE pull request (group `all`): every update
# runs the whole CI, and weekly single updates were about 30 CI runs a month for little gain. Security fixes do
# not wait for the schedule: Dependabot opens them as soon as an advisory is published.
# New versions wait 7 days (cooldown) in case a malicious release is caught and pulled.
version: 2
updates:
  - package-ecosystem: composer
    directory: /apps/api
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      all: { patterns: ['*'] }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      all: { patterns: ['*'] }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      all: { patterns: ['*'] }
    commit-message: { prefix: build, include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      all: { patterns: ['*'] }
    commit-message: { prefix: ci }

  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, include: scope }
